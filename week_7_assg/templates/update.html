{% extends "base.html" %}

{% block content %}

<h1>Update Student</h1>

<form action="{{ url_for('update_student', student_id=student.student_id) }}" method="POST">

    <p>
        Roll Number<br>
        <input type="text" value="{{ student.roll_number }}" readonly>
    </p>

    <p>
        First Name<br>
        <input
            type="text"
            name="f_name"
            value="{{ student.first_name }}"
            required>
    </p>

    <p>
        Last Name<br>
        <input
            type="text"
            name="l_name"
            value="{{ student.last_name }}">
    </p>

    <p><strong>Select Courses</strong></p>

    {% if courses %}

        {% for course in courses %}

        <label>

            <input
                type="checkbox"
                name="courses"
                value="{{ course.course_id }}"
                {% if course.course_id in enrolled_courses %}
                checked
                {% endif %}>

            {{ course.course_code }} - {{ course.course_name }}

        </label>

        <br>

        {% endfor %}

    {% else %}

        <p>No courses available.</p>

    {% endif %}

    <br><br>

    <input type="submit" value="Update">

    <a href="{{ url_for('home') }}">Cancel</a>

</form>

{% endblock %}
