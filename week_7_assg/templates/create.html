{% extends "base.html" %}

{% block content %}

<h1>Add Student</h1>

<form action="{{ url_for('create_student') }}" method="POST">

    <p>
        Roll Number<br>
        <input type="text" name="roll" required>
    </p>

    <p>
        First Name<br>
        <input type="text" name="f_name" required>
    </p>

    <p>
        Last Name<br>
        <input type="text" name="l_name">
    </p>

    <p><strong>Select Courses</strong></p>

    {% if courses %}

        {% for course in courses %}

        <label>
            <input
                type="checkbox"
                name="courses"
                value="{{ course.course_id }}">

            {{ course.course_code }} -
            {{ course.course_name }}

        </label>
        <br>

        {% endfor %}

    {% else %}

        <p>No courses available.</p>

    {% endif %}

    <br>

    <input type="submit" value="Add Student">

    <a href="{{ url_for('home') }}">Cancel</a>

</form>

{% endblock %}
